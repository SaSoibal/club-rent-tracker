<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Club Rent Tracker – Role-based UI Prototype v2</title>
<style>
:root{--p:#0f766e;--pl:#e6f4f1;--gl:#dcfce7;--rl:#fee2e2;--al:#fef3c7;--bl:#dbeafe;--t:#1f2937;--m:#6b7280;--bg:#f6f8f7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",Arial,sans-serif;background:#e4ebe8;color:var(--t);min-height:100vh}
.layout{display:grid;grid-template-columns:265px 414px 300px;gap:28px;padding:28px;justify-content:center;align-items:start}
.panel{background:#fff;border-radius:16px;padding:20px;position:sticky;top:28px;max-height:calc(100vh - 56px);overflow-y:auto}
.panel::-webkit-scrollbar{width:0}
.panel h1{font-size:17px;color:var(--p)}
.sub{font-size:12.5px;color:var(--m);margin:4px 0 12px;line-height:1.5}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--m);margin:16px 0 6px;font-weight:700}
.nav-btn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 9px;border:0;background:none;border-radius:10px;font-size:13.5px;cursor:pointer;color:#374151;margin-bottom:2px}
.nav-btn .n{width:22px;height:22px;border-radius:50%;background:#eef2f1;font-size:11px;display:grid;place-items:center;font-weight:700;color:var(--m);flex-shrink:0}
.nav-btn.on{background:var(--pl);color:var(--p);font-weight:600}
.nav-btn.on .n{background:var(--p);color:#fff}
.demo3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.demo3 button{border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:8px 4px;font-size:12px;font-weight:600;cursor:pointer;color:#374151}
.demo3 button:hover{border-color:var(--p);color:var(--p)}
.info h3{font-size:15px;margin-bottom:8px}
.info p{font-size:13.5px;line-height:1.6;color:#374151}
.info ul{margin:10px 0 0 18px;font-size:13px;line-height:1.7;color:#374151}
/* phone */
.phone{width:390px;height:820px;background:#fff;border-radius:44px;border:12px solid #111827;position:relative;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.28);display:flex;flex-direction:column}
.status{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:700;flex-shrink:0;background:#fff}
.screen{flex:1;overflow-y:auto;background:var(--bg);padding:4px 16px 20px}
.screen::-webkit-scrollbar{width:0}
.tabbar{height:70px;display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;border-top:1px solid #e5e7eb;background:#fff;flex-shrink:0}
.tab{background:none;border:0;font-size:10.5px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;width:64px;position:relative}
.tab i{font-style:normal;font-size:18px}
.tab.on{color:var(--p);font-weight:700}
.tbadge{position:absolute;top:-2px;right:8px;background:#dc2626;color:#fff;font-size:9px;border-radius:99px;padding:1px 5px;font-weight:700}
/* common */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 12px;gap:8px}
.hdr-back{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
.back{width:36px;height:36px;border-radius:50%;background:#fff;border:0;font-size:20px;cursor:pointer;color:var(--t)}
.h1{font-size:20px;font-weight:800}
.muted{color:var(--m)}.small{font-size:12px}.bold{font-weight:600}.center{text-align:center}
.grow{flex:1;min-width:0}.red{color:var(--rl)}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.ok{background:var(--gl)}.card.warn{background:var(--al)}.card.due{background:var(--rl)}.card.info{background:var(--bl)}
.big{font-size:26px;font-weight:800;margin:4px 0 10px}
.big span{font-size:13px;color:var(--m);font-weight:500}
.big2{font-size:21px;font-weight:800;margin:4px 0}
.bar{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,#14b8a6,var(--p));border-radius:99px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tile{border-radius:14px;padding:10px 4px;text-align:center}
.tile b{display:block;font-size:18px}.tile span{font-size:10.5px}
.tile.g{background:var(--gl);color:#166534}.tile.r{background:var(--rl);color:#991b1b}.tile.a{background:var(--al);color:#92400e}.tile.b{background:var(--bl);color:#1e40af}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats3 div{background:#fff;border-radius:14px;padding:10px 6px;text-align:center}
.stats3 b{display:block;font-size:15px}.stats3 span{font-size:11px;color:var(--m)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:14.5px;font-weight:600;cursor:pointer;background:#eef2f1;color:var(--t);margin-bottom:10px;text-align:center;font-family:inherit}
.btn.primary{background:var(--p);color:#fff}
.btn.ghost{background:#fff;border:1px solid #d1d5db}
.btn.small{width:auto;display:inline-block;padding:8px 12px;font-size:12.5px;margin:0}
.btn.danger{background:var(--rl);color:#991b1b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.qa{border:0;background:#fff;border-radius:14px;padding:13px 10px;font-size:13px;font-weight:600;text-align:left;cursor:pointer;color:var(--t);box-shadow:0 1px 2px rgba(0,0,0,.05);font-family:inherit}
.sec{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}
.sec h3{font-size:14px}
.sec a{font-size:13px;color:var(--p);cursor:pointer;font-weight:600}
.mswitch{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:6px;margin-bottom:12px}
.mswitch button{width:34px;height:34px;border:0;border-radius:10px;background:var(--pl);color:var(--p);font-size:19px;cursor:pointer}
.mswitch button:disabled{opacity:.3}
.mswitch b{font-size:14px}
.chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chip{border:1px solid #d1d5db;background:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;white-space:nowrap;cursor:pointer;color:#374151;font-family:inherit}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.seg3{display:flex;background:#e9efec;border-radius:12px;padding:4px;margin-bottom:12px}
.seg3 button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--m);cursor:pointer;font-family:inherit}
.seg3 button.on{background:#fff;color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.list{background:#fff;border-radius:18px;overflow:hidden;margin-bottom:12px}
.item{padding:12px 14px;border-bottom:1px solid #f0f2f1;cursor:pointer;font-size:14px}
.item:last-child{border-bottom:0}
.avatar{width:40px;height:40px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0;cursor:pointer}
.avatar.sm{width:34px;height:34px;font-size:11.5px}
.avatar.lg{width:72px;height:72px;font-size:24px;cursor:default}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:#fff;font-size:17px;position:relative;cursor:pointer}
.badge{position:absolute;top:-4px;right:-4px;background:#dc2626;color:#fff;font-size:10px;border-radius:99px;padding:1px 5px;font-weight:700}
.pill{font-size:11px;font-weight:700;padding:4px 8px;border-radius:99px;white-space:nowrap}
.pill.g{background:var(--gl);color:#166534}.pill.r{background:var(--rl);color:#991b1b}.pill.a{background:var(--al);color:#92400e}.pill.n{background:#f3f4f6;color:var(--m)}.pill.b{background:var(--bl);color:#1e40af}
.mini{font-size:11px;background:#f1f5f4;border-radius:6px;padding:2px 6px;margin-right:4px;display:inline-block;margin-top:4px}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#f1f5f4}
.thumb.ph{display:grid;place-items:center;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}
.cell{border-radius:12px;padding:8px 0;text-align:center;cursor:pointer;font-size:11.5px;font-weight:700;background:#fff;border:1px solid #e5e7eb}
.cell small{display:block;font-size:12px;margin-top:2px}
.cell.paid{background:var(--gl);color:#166534;border-color:#bbf7d0}
.cell.due{background:var(--rl);color:#991b1b;border-color:#fecaca}
.cell.note{background:var(--al);color:#92400e;border-color:#fde68a}
.cell.review{background:var(--bl);color:#1e40af;border-color:#bfdbfe}
.cell.future,.cell.na{color:#9ca3af;background:#f9fafb}
.legend{display:flex;gap:10px;font-size:10.5px;color:var(--m);margin-bottom:8px;justify-content:center;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}
.tbl{overflow-x:auto;background:#fff;border-radius:14px;padding:8px;margin-bottom:12px}
.mtx{border-collapse:separate;border-spacing:3px;font-size:11px}
.mtx th{font-weight:600;color:var(--m);padding:2px 3px;font-size:10.5px}
.mtx td.nm{font-weight:600;white-space:nowrap;padding-right:6px;cursor:pointer;font-size:11.5px}
.mtx td.c{width:30px;height:26px;text-align:center;border-radius:6px;font-weight:700;font-size:11px}
.mtx .paid{background:#dcfce7;color:#166534}.mtx .due{background:#fee2e2;color:#991b1b}.mtx .note{background:#fef3c7;color:#92400e}.mtx .review{background:#dbeafe;color:#1e40af}.mtx .na,.mtx .future{color:#d1d5db}
.mtx tr.tot td{font-weight:700;font-size:10px;color:var(--p)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:13.5px;gap:10px}
.kv span{color:var(--m)}
.steps{margin:10px 0 14px 18px;font-size:13px;line-height:1.7;color:#374151}
.amount{background:var(--pl);border-radius:14px;padding:12px;text-align:center;margin-bottom:14px}
.amount b{font-size:28px;color:var(--p)}
.shot{width:100%;border-radius:12px;border:1px solid #e5e7eb;margin:8px 0;display:block}
.dropzone{display:block;border:2px dashed #94a3b8;border-radius:14px;padding:16px;text-align:center;cursor:pointer;background:#fff;font-size:13px}
.noshot{background:#f1f5f4;border-radius:12px;padding:18px;text-align:center;font-size:13px;color:var(--m);margin:8px 0}
.quote{background:#f8fafc;border-left:3px solid var(--p);padding:8px 10px;border-radius:8px;font-size:13px;font-style:italic;margin-top:8px}
.dot2{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p);margin-right:6px}
.chipwrap{display:flex;flex-wrap:wrap;gap:6px}
.logo{width:72px;height:72px;border-radius:22px;background:var(--p);color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-size:32px}
.login-top{text-align:center;padding:20px 0 12px}
.otprow{display:flex;gap:10px;justify-content:center;margin:12px 0}
.otp{width:52px;height:56px;text-align:center;font-size:22px;border:1px solid #d1d5db;border-radius:12px;font-family:inherit}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:#374151;margin-top:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid3 button{border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:12px 4px;font-size:12.5px;font-weight:600;cursor:pointer;color:#374151;font-family:inherit}
.grid3 button:hover{border-color:var(--p);color:var(--p)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--m);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:12px;font-size:14px;font-family:inherit;background:#fff;color:var(--t)}
.field textarea{min-height:76px;resize:none}
.field input.cc{width:76px;flex-shrink:0}
.mini-sel{padding:6px;border:1px solid #d1d5db;border-radius:9px;font-size:12px;font-family:inherit;max-width:120px}
.segm{display:grid;grid-template-columns:1fr 1fr;background:#f1f5f4;padding:4px;border-radius:12px}
.segm button{border:0;background:none;padding:9px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--m);font-family:inherit}
.segm button.on{background:#fff;color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* overlay / sheet */
.overlay{position:absolute;inset:0;z-index:10}
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:12px 18px 22px;max-height:90%;overflow-y:auto}
.sheet::-webkit-scrollbar{width:0}
.grab{width:40px;height:5px;border-radius:9px;background:#d1d5db;margin:0 auto 12px}
.toast{position:absolute;left:20px;right:20px;top:52px;background:#111827;color:#fff;padding:11px 14px;border-radius:12px;font-size:13px;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
.toast.show{opacity:1}
.demo-scen{margin-top:14px;border-top:1px dashed #d1d5db;padding-top:10px}
.seg-mini{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.seg-mini button{border:1px solid #d1d5db;background:#fff;border-radius:99px;padding:5px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.seg-mini button.on{background:#111827;color:#fff;border-color:#111827}
table.chk{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px;background:#fff;border-radius:12px;overflow:hidden}
table.chk th{text-align:left;background:#f1f5f4;padding:7px 8px;font-size:11.5px;color:var(--m)}
table.chk td{padding:7px 8px;border-top:1px solid #eef2f1;vertical-align:top}
.okc{color:#166534}.badc{color:#b91c1c}
.verdict{border-radius:12px;padding:10px 12px;font-size:12.5px;margin:6px 0 10px;line-height:1.5}
.verdict.good{background:var(--gl);color:#166534}.verdict.bad{background:var(--rl);color:#991b1b}
</style>
</head>

/* ---- status & money ---- */
function pendingShot(u,i){return reqs.find(r=>r.uid===u.id&&r.month===i&&r.status==='pending'&&r.kind==='screenshot');}
function st(u,i){
  if(i>CUR) return 'future';
  const h=u.h[i];
  if(h==='X') return 'na';
  if(h==='P') return 'paid';
  if(pendingShot(u,i)) return 'review';
  if(u.notes&&u.notes[i]) return 'note';
  return 'due';
}
function getDet(u,i){
  if(u.extra&&u.extra[i]) return u.extra[i];
  const s=parseInt(u.id.slice(1))*31+i*17, cash=s%3===0;
  return {method:cash?'Cash':'bKash',trx:cash?'—':'BK'+((s*104729)%1000000000).toString(36).toUpperCase().padStart(8,'0'),date:(1+s%27)+' '+MONTHS[i]+' '+YEAR};
}
function outList(u){const a=[];for(let i=0;i<=CUR;i++){const s=st(u,i);if(s==='due'||s==='note'||s==='review')a.push(i);}return a;}
function outSum(u){return outList(u).reduce((a,i)=>a+amount(i),0);}
function defMonth(u){if(!u)return CUR;if(u.h[CUR]!=='P'&&st(u,CUR)!=='na')return CUR;const l=outList(u);return l.length?l[l.length-1]:CUR;}
function sumOf(list,i){
  const c={paid:0,due:0,note:0,review:0,total:0,exp:0,col:0};
  list.forEach(u=>{const s=st(u,i); if(s==='na'||s==='future')return; c.total++; c[s]++;});
  c.exp=c.total*amount(i); c.col=c.paid*amount(i); return c;
}
function payee(u){
  if(u.role==='member'){const c=U(u.collector); if(c&&c.bkash) return {name:c.name+' (Collector)',no:c.bkash};}
  return {name:club.bkash.name+' (Admin)',no:club.bkash.no};
}
function markPaid(u,i,info){
  u.h=u.h.slice(0,i)+'P'+u.h.slice(i+1);
  u.extra=u.extra||{}; u.extra[i]=info;
  if(u.notes) delete u.notes[i];
}
function notify(uid,title,body,kind,extra){
  notifs.unshift(Object.assign({id:nid++,uid,title,body,kind,at:'Just now',read:false},extra||{}));
}
function myNotifs(){return notifs.filter(n=>n.uid===S.uid);}
function unread(){return myNotifs().filter(n=>!n.read).length;}
function markRead(){notifs.forEach(n=>{if(n.uid===S.uid)n.read=true;});}
function reqsFor(){return role()==='admin'?reqs:reqs.filter(r=>U(r.uid).collector===me().id);}
function reqPill(r){return r.status==='pending'?'<span class="pill b">Pending</span>':r.status==='confirmed'?'<span class="pill g">Confirmed</span>':'<span class="pill r">Rejected</span>';}
function pill(s){const m={paid:['g','Paid'],due:['r','Due'],note:['a',"Won't pay"],review:['b','Review'],future:['n','—'],na:['n','—']};const [c,t]=m[s];return `<span class="pill ${c}">${t}</span>`;}

    case 'remark': S.sp.month=S.sp.month??defMonth(m); S.sp.reason=''; S.sp.text=''; S.sp.promise=''; break;
    case 'review': { const r=reqs.find(x=>x.id===S.sp.reqId)||reqs.find(x=>x.status==='pending'); if(!r){S.sheet=null;toast('No pending requests');render();return;} S.sp.reqId=r.id; S.sp.method=r.kind==='screenshot'?'bKash':'Cash'; S.sp.trx=r.trx||''; S.sp.rej=''; S.sp.vok=false; break; }
    case 'task': S.sp.title='Collect rent – '; S.sp.collector=S.sp.collector||collectors()[0].id; S.sp.month=CUR; S.sp.due='12 Oct'; break;
    case 'member': {
      if(S.sp.mode==='edit'){const u=U(S.sp.uid); Object.assign(S.sp,{name:u.name,phone:u.phone,role:u.role,collector:u.collector});}

    case 'remove': S.sp.uid=S.sp.uid; break;
  }
  render();
}

  if(S.sp.ocrState==='reading'){toast('Still reading the screenshot…');return;}
  const amt=+S.sp.amt, trx=(S.sp.trx||'').trim();
  if(!amt){toast('Enter the amount from the screenshot');return;}
  if(!trx){toast('Enter the TrxID from the screenshot');return;}
  const r={id:nid++,uid:m.id,month:i,kind:'screenshot',amount:amt,expected:amount(i),trx,receiver:(S.sp.receiver||'').trim(),dateTime:S.sp.dateTime||'',shot:S.sp.shot,ocr:S.sp.ocrState==='done',msg:'',at:'18 Oct · now',status:'pending'};
  reqs.push(r);
  const dup=dupTrx(trx,r.id);
  notify(m.collector||'u1','New bKash screenshot',`${m.name} · ${FULL[i]} · ${fmt(amt)} · TrxID ${trx}${dup?' ⚠ TrxID already used':''}`,'review',{reqId:r.id});
  notify(m.id,'Screenshot sent','Your collector will verify the payment and update your status.','info');
  S.sheet=null; toast('Submitted for verification ✓'); render();
}
function dupTrx(trx,exceptId){
  if(!trx) return null;
  const rq=reqs.find(r=>r.id!==exceptId&&r.trx===trx&&r.status!=='rejected');
  if(rq) return U(rq.uid).name+' · '+FULL[rq.month];
  for(const u of users){ if(u.extra){ for(const k of Object.keys(u.extra)){ if(u.extra[k].trx===trx) return u.name+' · '+FULL[k]; } } }
  return null;
}

/* ----- review request (staff) ----- */
function checksOf(r){
  const u=U(r.uid), expected=r.expected??amount(r.month), p=payee(u);
  const dup=dupTrx(r.trx,r.id);
  const last3=s=>String(s||'').replace(/\D/g,'').slice(-3);
  const amtOk=r.amount===expected, rcvOk=last3(r.receiver)===last3(p.no);
  return {
    amt:{ok:amtOk,note:amtOk?'matches due':'due is '+fmt(expected)},
    trx:{ok:!!r.trx&&!dup,note:!r.trx?'missing':(dup?'already used by '+dup:'unique')},
    rcv:{ok:rcvOk,note:rcvOk?'matches collector':'different number'},
    blocking:!amtOk||!!dup||!r.trx
  };
}
function chkRow(label,val,c){return `<tr><td>${label}</td><td><b>${val}</b></td><td class="${c===null?'':(c.ok?'okc':'badc')}">${c===null?'':(c.ok?'✓ ':'✗ ')+esc(c.note)}</td></tr>`;}
function sReview(){
  const r=reqs.find(x=>x.id===S.sp.reqId), u=U(r.uid), done=r.status!=='pending';
  if(r.kind!=='screenshot') return sReviewUpdate(r,u,done);
  const c=checksOf(r);
  const reasons=['Amount does not match','TrxID already used','Wrong receiver','Screenshot unclear'];
  return `<div class="grab"></div><div class="h1">Verify payment</div>
  <div class="small muted" style="margin-bottom:10px">📷 Screenshot · ${r.at} · ${reqPill(r)}</div>
  <div class="card" style="margin-bottom:8px"><div class="row"><div class="avatar sm" style="background:${colOf(u)}">${ini(u.name)}</div><div><b>${u.name}</b><div class="small muted">${FULL[r.month]} ${YEAR} · due ${fmt(r.expected??amount(r.month))}</div></div></div></div>
  <img class="shot" src="${r.shot}" alt="bKash screenshot"/>
  <div class="small bold" style="margin:10px 0 6px">Read from screenshot</div>
  <table class="chk"><tr><th>Field</th><th>Value</th><th>Check</th></tr>
    ${chkRow('Amount',fmt(r.amount),c.amt)}${chkRow('TrxID',esc(r.trx)||'—',c.trx)}${chkRow('Receiver',esc(r.receiver)||'—',c.rcv)}${chkRow('Date / time',esc(r.dateTime)||'—',null)}
  </table>
  ${done?`<div class="verdict ${r.status==='confirmed'?'good':'bad'}">${r.status==='confirmed'?'Confirmed and recorded':'Rejected: '+esc(r.reason)}</div><button class="btn ghost" onclick="closeSheet()">Close</button>`
  :`<div class="verdict ${c.blocking?'bad':'good'}">${c.blocking?'Cannot confirm yet. Fix the failed check or reject the request.':'Key checks passed. Compare with the screenshot, then confirm.'}</div>
  <label class="check"><input type="checkbox" ${S.sp.vok?'checked':''} onchange="S.sp.vok=this.checked;renderSheet()"/> I checked the screenshot and the details match</label>
  <button class="btn primary" ${c.blocking?'disabled':''} onclick="doConfirm(${r.id})">✓ Verify & confirm payment</button>
  <div class="small bold" style="margin:12px 0 6px">Reject with reason</div>
  <div class="chipwrap">${reasons.map(x=>`<button class="chip ${S.sp.rej===x?'on':''}" onclick="S.sp.rej='${x}';renderSheet()">${x}</button>`).join('')}</div>
  <div class="field" style="margin-top:8px"><input value="${esc(S.sp.rej)}" oninput="S.sp.rej=this.value" placeholder="Or type a reason"/></div>
  <button class="btn danger" onclick="doReject(${r.id})">Reject &amp; ask member to re-upload</button>`}`;
}
function sReviewUpdate(r,u,done){
  return `<div class="grab"></div><div class="h1">Update request</div>
  <div class="small muted" style="margin-bottom:10px">🙋 ${r.at} · ${reqPill(r)}</div>
  <div class="card"><div class="row"><div class="avatar sm" style="background:${colOf(u)}">${ini(u.name)}</div><div><b>${u.name}</b><div class="small muted">${FULL[r.month]} ${YEAR} · ${fmt(r.amount)}</div></div></div>${r.msg?`<div class="quote">"${esc(r.msg)}"</div>`:''}</div>
  <div class="noshot">No screenshot attached. Check your records before confirming.</div>
  ${done?`<div class="verdict ${r.status==='confirmed'?'good':'bad'}">${r.status==='confirmed'?'Confirmed':'Rejected: '+esc(r.reason)}</div>`:`
  <div class="field"><label>bKash TrxID (if any)</label><input value="${esc(S.sp.trx)}" oninput="S.sp.trx=this.value"/></div>
  <div class="field"><label>Method received</label>${segMethod()}</div>
  <label class="check"><input type="checkbox" ${S.sp.vok?'checked':''} onchange="S.sp.vok=this.checked;renderSheet()"/> I verified this payment</label>
  <button class="btn primary" onclick="doConfirm(${r.id})">✓ Confirm — mark as paid</button>
  <div class="field" style="margin-top:6px"><input value="${esc(S.sp.rej)}" oninput="S.sp.rej=this.value" placeholder="Reject reason"/></div>
  <button class="btn danger" onclick="doReject(${r.id})">Reject request</button>`}
  <button class="btn ghost" onclick="closeSheet()">Close</button>`;
}
function doConfirm(id){
  const r=reqs.find(x=>x.id===id), u=U(r.uid);
  if(r.kind==='screenshot'){
    if(checksOf(r).blocking){toast('Resolve the failed check first');return;}
    if(!S.sp.vok){toast('Tick the verification box first');return;}
    markPaid(u,r.month,{method:'bKash',amount:r.amount,trx:r.trx,date:r.dateTime||TODAY,receiver:r.receiver,shot:r.shot,via:'screenshot',verifiedBy:first(me().name)+' · '+TODAY});
  } else {
    if(!S.sp.vok){toast('Tick the verification box first');return;}
    const method=S.sp.method||'Cash', trx=(S.sp.trx||'').trim();
    if(method==='bKash'&&!trx){toast('Enter the bKash TrxID');return;}
    markPaid(u,r.month,{method,amount:r.expected??amount(r.month),trx:method==='bKash'?trx:'—',date:TODAY,via:'request',verifiedBy:first(me().name)+' · '+TODAY});
  }
  r.status='confirmed';
  notify(u.id,'Payment confirmed ✓',`Your ${FULL[r.month]} rent of ${fmt(r.amount)} was verified by ${me().name}.`,'ok',{month:r.month});
  S.sheet=null; toast(`${u.name}'s payment confirmed ✓`); go('inbox',{seg:'req'});
}
function doReject(id){
  const r=reqs.find(x=>x.id===id), u=U(r.uid), why=(S.sp.rej||'').trim();
  if(!why){toast('Write or choose a reason');return;}
  r.status='rejected'; r.reason=why;
  notify(u.id,'Payment request rejected',why+'. Please check and upload again or contact your collector.','bad',{month:r.month});
  S.sheet=null; toast('Rejected · member notified'); go('inbox',{seg:'req'});
}

  ${a?`<div class="field"><label>Role</label><select onchange="S.sp.role=this.value;renderSheet()">${['member','collector','admin'].map(r=>`<option value="${r}" ${r===S.sp.role?'selected':''}>${cap(r)}</option>`).join('')}</select></div>`:''}
  ${(S.sp.role==='member')?`<div class="field"><label>Assigned collector</label><select onchange="S.sp.collector=this.value">${collectors().map(c=>`<option value="${c.id}" ${c.id===S.sp.collector?'selected':''}>${c.name}</option>`).join('')}</select></div>`:''}

  <button class="btn primary" onclick="doMember()">${edit?'Save changes':'Add member'}</button>`;
}
function doMember(){
  const sp=S.sp, name=(sp.name||'').trim(), phone=(sp.phone||'').replace(/\s/g,'');
  if(!name||!/^01\d{9}$/.test(phone)){toast('Enter name and a valid 11-digit number');return;}
  if(users.some(u=>u.phone===phone&&u.active&&u.id!==sp.uid)){toast('This number already belongs to a member');return;}
  const a=role()==='admin';
  if(sp.mode!=='edit'){
    const r=a?(sp.role||'member'):'member', join=sp.join??CUR;
    const h='X'.repeat(join)+'D'.repeat(12-join);
    users.push({id:'u'+nid++,name,phone,role:r,pays:r!=='admin',active:true,collector:r==='member'?(sp.collector||me().id):null,bkash:r==='collector'?'':null,h:r==='admin'?null:h,notes:{}});
    S.sheet=null; toast(`${name} added as ${r}`); render(); return;
  }
  const u=U(sp.uid); u.name=name; u.phone=phone;
  if(a){
    const r=sp.role||u.role; u.role=r; u.pays=r!=='admin';
    if(r==='member') u.collector=sp.collector||u.collector;
    if(r!=='member') u.collector=null;
    if(!u.h&&r!=='admin') u.h='X'.repeat(CUR)+'D'.repeat(12-CUR);
  }
  S.sheet=null; toast('Member updated'); render();
}

  const u=U(S.sp.uid);

function renderLeft(){
  const u=me(); let h=`<h1>Club Rent Tracker</h1><p class="sub">Clickable prototype · login + 3 roles (Admin, Collector, Member).</p>
  <div class="label">Demo accounts</div><div class="grid3" style="grid-template-columns:1fr 1fr 1fr">
  <button onclick="quickLogin('admin')">Admin</button><button onclick="quickLogin('collector')">Collector</button><button onclick="quickLogin('member')">Member</button></div>`;
  if(u){
    const r=u.role;
    h+=`<div class="label">${cap(r)} screens</div>`+NAVS[r].map(([k,l])=>{const idx=NAVS[r].findIndex(x=>x[0]===k)+1;return `<button class="nav-btn ${navOn(k)?'on':''}" onclick="jumpNav('${k}')"><span class="n">${idx}</span>${l}</button>`;}).join('')
    +`<div class="label">Pop-ups (${cap(r)})</div>`+POPUPS[r].map(([k,l])=>`<button class="nav-btn ${S.sheet===k?'on':''}" onclick="openSheet('${k}')"><span class="n">＋</span>${l}</button>`).join('')
    +`<button class="btn danger" style="margin-top:12px" onclick="logout()">Log out</button>`;
  } else {
    h+=`<div class="label">Screens</div><button class="nav-btn on"><span class="n">1</span>Login page</button>
    <p class="sub" style="margin-top:12px">Mobile number + OTP for every role (demo OTP <b>1234</b>). The number decides the role. The session stays on this device until Log out.</p>`;
  }
  $('left').innerHTML=h;
}

function renderInfo(){
  const key=S.sheet?'sheet:'+S.sheet:(!me()?'login':(S.route==='home'?'home:'+role():S.route));
  const I=INFO[key]||INFO.login;
  $('info').innerHTML=`<h3>${I.t}</h3><p>${I.d}</p><ul>${I.b.map(x=>`<li>${x}</li>`).join('')}</ul>
  <div class="label" style="margin-top:18px">Access by role</div>
  <p style="font-size:12.5px;line-height:1.6"><b>Admin:</b> everything, plus rent setup, collector assignment, tasks, club bKash.<br/><b>Collector:</b> own group + all history, collect, notify, review requests, own bKash info.<br/><b>Member:</b> own history, pay via bKash, upload screenshot, request update, alerts.</p>`;
}
function render(){
  const logged=!!me();
  $('screen').innerHTML=logged?screenHTML():loginScreen();
  const tb=$('tabbar');
  tb.style.display=logged?'flex':'none';
  if(logged){
    const tabOn=k=>S.route===k||(S.route==='member'&&k==='members');
    tb.innerHTML=TABS[role()].map(([k,ic,l])=>`<button class="tab ${tabOn(k)?'on':''}" onclick="go('${k}')"><i>${ic}</i>${l}${k==='inbox'&&unread()?`<span class="tbadge">${unread()}</span>`:''}</button>`).join('');
  }
  renderLeft(); renderInfo(); renderSheet();
}

/* ================= BOOT ================= */
(function boot(){
  const saved=readSession();
  if(saved&&U(saved)&&U(saved).active){ S.uid=saved; S.route='home'; S.scope=defaultScope(); }
  render();
})();
</script>
