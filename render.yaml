# Render Blueprint: one web service with a persistent disk for the SQLite database and screenshots.
# Persistent disks need a paid instance (starter). The free plan cannot keep the database.
services:
  - type: web
    name: club-rent-tracker
    runtime: node
    region: singapore          # closest region to Dhaka
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DEMO                # must stay 0 on a public server (no OTP codes in responses)
        value: "0"
      - key: DATA_DIR            # database and uploads live on the persistent disk
        value: /var/data
      - key: ADMIN_NAME
        value: Club Admin
      - key: ADMIN_PHONE         # set in the Render dashboard: your admin mobile, e.g. 01XXXXXXXXX
        sync: false
      - key: SMS_PROVIDER        # sign-in stays disabled until an SMS provider is connected
        sync: false
    disk:
      name: club-data
      mountPath: /var/data
      sizeGB: 1
